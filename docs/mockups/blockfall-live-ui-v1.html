<body><main class="workspace"><div class="top"><div><div class="eyebrow">Studio build · visual proposals · 5 October 2026</div><h1>Blockfall UI concepts</h1><p>Every live Roblox UI family, mapped from the running Skyhold Bazaar build. Use the selector to inspect states; controls inside the preview switch related examples.</p></div><span class="stamp">Concepts · no game files changed</span></div><div class="toolbar"><label for="view">View</label><select id="view"></select><label for="format">Room size</label><select id="format"><option>1v1</option><option>2v2</option><option>3v3</option></select><div class="seg" aria-label="Preview size"><button type="button" id="desktop" aria-pressed="true">Desktop</button><button type="button" id="mobile" aria-pressed="false">Narrow</button></div><span class="small-note" id="counter"></span></div><div class="viewer"><div class="screen-frame"><div id="screen" class="screen" aria-live="polite"></div></div><aside class="side"><h2 id="note-title"></h2><p id="note-text"></p><ul id="note-points"></ul></aside></div></main>
<script>
const views=[
['bazaar','Skyhold Bazaar','Keep the pixel market and bold arcade tone. Make destination and interaction text easier to scan.',['District reveal remains brief','One clear action near the fighter','Character and social tools stay available']],
['social-stamps','Social · Stamps','A compact social panel over the live bazaar, with all eight stamps.',['One panel at a time','Keyboard digits mirror the tiles','Player bubbles remain in world']],
['social-say','Social · Say','Fixed quick messages, ordered by likely use.',['No free text is invented','The log stays secondary','Panel closes after a send']],
['social-people','Social · People','Member list with location and contextual warp.',['Current player is marked','Warp is available only where valid','Long lists can scroll']],
['social-map','Social · Bazaar map','Five existing roof warp destinations.',['Destination names come from live data','Each choice keeps a readable label','A map is a navigation tool, not a new mode']],
['studio','Character Studio','Keep the current two-column creator: real fighter preview, tabs, part tiles and colours.',['Selected parts read clearly','Save/wear stays primary','Session-only saving is explicit']],
['studio-confirm','Character · Unsaved changes','A focused confirmation for leaving or deleting.',['Destructive choice is explicit','Back preserves the edit','No false persistence claim']],
['arcade','Arcade cabinet','One card for the cabinet state, with sit, CPU and watch actions.',['Seats and occupancy are visible','Only available actions are shown','Stop watching remains persistent']],
['watching','Watching a cabinet fight','The match HUD is visible while spectating, with an exit action.',['No local-player ability prompt','Stop watching is persistent','Spectating never implies a controllable fighter']],
['lounge','Walkable preparation lounge','A small room status HUD over the physical stations.',['Hiding selection keeps the phase visible','Exit remains a world destination','No full-screen dashboard while walking']],
['pick','Room · Pick and ready','Keep round roster portraits, posed fighters, team pedestals, stats and readiness.',['Your card has a gold outline','Empty bot slot says what it is','Ready follows a deliberate press']],
['bot-vote','Room · Bot ballot','A proposed bot is a room vote, with countdown and yes/no choices.',['Tally and time live beside the slot','Proposal shows difficulty','A vote is separate from readiness']],
['map-vote','Room · Map vote','Use all nine live arena names plus Random, with vote count and visible ballot.',['Map names remain readable','Voter state sits near the cards','Clock and choice share a scan path']],
['rules-vote','Room · Rules vote','Compare Tournament, Casual, Chaos and Keep Current.',['Three decision facts per card','Vote count and selected state are distinct','All four actual choices remain']],
['boards','Room boards · Maps / Weapons / Rules / Players','Secondary station boards for detailed setup, behind the main select.',['Host versus player permissions are clear','Choices confirm from server','Current room phase remains visible']],
['notice','Join / loading / error','Small contextual notice over the room or bazaar.',['No invented progress percentage','Error has a clear acknowledgement','Waiting state cannot be mistaken for success']],
['climb','Skyline Climb','Checkpoint, time, falls, best, restart, records and leave are visible during play.',['Course remains dominant','Paid skip is kept apart','Current and best progress differ']],
['records','Climb Records','Two boards for speed and reach, plus your own standing.',['Current player anchors the view','Empty boards can explain themselves','Close returns to the climb/bazaar']],
['fight-count','Fight · Stage and countdown','Stage name and count take priority before the fight; combo guide is secondary.',['Fighters stay visible','Timed clock appears only where appropriate','H for combos remains available']],
['fight-live','Fight · Active HUD','Damage, stocks, ultimate blocks, shield state and overhead tags stay easy to scan.',['Gold outline marks you','Team colour and shape work together','Percent is the largest tile value']],
['fight-alert','Fight · Combo / disaster / sudden death','One event hierarchy handles warnings, combos, break prompt and urgent timer.',['Warnings do not cover player identity','Disaster and combo use separate zones','Urgency includes words, not colour alone']],
['fight-ult','Fight · Ultimate cinematic','The caster and move title ride the cutscene without replacing the whole HUD.',['Readable on bright and dark stages','Caster ownership is explicit','Name follows the visual effect']],
['results','Results · Podium','Preserve the dusk podium, fighter poses, finish order and Say GG action.',['Rank and winner are primary','Stats remain readable for all slots','Return cue matches server-driven flow']]
];
const $=id=>document.getElementById(id), state={view:'bazaar',mobile:false,board:'Maps',notice:'waiting',format:'1v1',choice:'Sword',group:'BODY',category:'BUILD'};
const btn=(label,color='blue',go)=>`<button type="button" class="ui-btn ${color}" ${go?`data-go="${go}"`:''}>${label}</button>`;
const fighter=(cpu=false,small=false)=>`<span class="fighter ${cpu?'cpu':''} ${small?'small':''}" aria-hidden="true"><i class="head"></i><i class="torso"></i><i class="arm"></i><i class="leg a"></i><i class="leg b"></i><i class="sword"></i></span>`;
function sky(dusk=false,lava=false){return `<div class="sky ${dusk?'dusk':''} ${lava?'lava':''}"></div>${lava?'':`<i class="cloud" style="left:8%;top:16%"></i><i class="cloud" style="left:78%;top:24%;transform:scale(1.3)"></i><i class="cloud" style="left:54%;top:78%"></i>`}`}
function socialBar(){return `<div class="social-bar">${[['T','STAMP','social-stamps','pink'],['Y','SAY','social-say','blue'],['P','PEOPLE','social-people','gold'],['M','MAP','social-map','green']].map(x=>`<button type="button" class="ui-btn ${x[3]}" data-go="${x[2]}"><span class="key">${x[0]}</span>${x[1]}</button>`).join('')}</div>`}
function bazaar(extra=''){return `${sky()}<div class="island market-ground"></div><div class="scene-mid"><div class="billboard"><span>BLOCKFALL</span></div><div class="stall left"><span class="sign">MASKS</span></div><div class="stall right"><span class="sign">SKEWERS</span></div><div class="scene-fighter">${fighter()}</div></div><div class="screen-title display">SKYHOLD BAZAAR</div><div class="screen-sub">Arcade cabinets · fighters’ gates · tailor’s terrace</div><div class="floating-sign" style="top:10%;left:31%;right:31%">CHAMPIONS’ SQUARE</div><div style="position:absolute;right:2%;top:2%;z-index:7">${btn('CHARACTER','blue','studio')}</div><div class="pill prompt">${extra?'Visit the social panel':'Walk the roofs: arcade and climb east, tailor west.'}</div><div class="bottom-ui"><div class="hint-row"><span class="key">AD</span> WALK <span class="key">WS</span> STEP IN / OUT <span class="key">SPACE</span> HOP <span class="key">E</span> USE</div>${socialBar()}</div>${extra}`}
function social(type){let head='',inside='';if(type==='stamps'){head='STAMPS';inside=`<div class="mini-map">${['GG','♥','🔥','HA!','☠','?','!','👍'].map((x,i)=>`<button class="option" type="button">${i+1} &nbsp; ${x}</button>`).join('')}</div>`}if(type==='say'){head='SAY';inside=`<div class="mini-map">${['Hello!','GG!','One more?','Nice!','Good luck!','Well played!','Thanks!','Rematch?','Let’s fight!','Close one!'].map((x,i)=>`<button class="option" type="button">${i+1} &nbsp; ${x}</button>`).join('')}</div>`}if(type==='people'){head='WHO IS HERE';inside=`<div class="scroll-list"><div class="option">● ETondes <span class="sub">Champions’ Square · you</span></div><div class="option">◆ Rowan <span class="sub">The Arcade Grove</span><span style="float:right">WARP</span></div><div class="option">▲ Ash <span class="sub">In a fight</span></div></div>`}if(type==='map'){head='BAZAAR MAP · WARP';inside=`<div class="scroll-list">${['Tailor’s Terrace','Champions’ Square','The Arcade Grove','Fighters’ Gates','Sky Climb'].map((x,i)=>`<button type="button" class="option">${i+1} &nbsp; ${x}</button>`).join('')}</div>`}return bazaar(`<div class="card" style="position:absolute;right:2%;bottom:8%;width:min(34%,340px);z-index:9"><div class="band" style="background:${type==='stamps'?'var(--pink)':type==='say'?'var(--blue)':type==='map'?'#399557':'var(--orange)'}">${head}</div><div class="dialog-body">${inside}<div class="row" style="margin-top:8px">${btn('CLOSE','dark','bazaar')}</div></div></div>`)}
const studioGroups={
 PRESETS:['Saved looks'], BODY:['Build','Head'], FACE:['Ears','Eyes','Brows','Nose','Mouth','Face marks'],
 HAIR:['Facial hair','Hair'], OUTFIT:['Top','Bottoms','Shoes'], EXTRAS:['Neckwear','Gloves','Eyewear','Headwear']
};
function studio(confirm=false){
 const categories=studioGroups[state.group], category=categories.includes(state.category)?state.category:categories[0];
 const options=category==='Build'?['Average','Slim','Athletic','Broad','Stocky']:category==='Saved looks'?['Fighter 1','New look']:['Default','Style 1','Style 2','Style 3','Style 4'];
 return `${bazaar()}<div class="editor-shell"><div class="editor-top"><strong class="display" style="font-size:27px;color:var(--gold)">CHARACTER STUDIO</strong><span class="row">${btn('FIGHTER 1','gold')}${btn('+','blue')}${btn('UNDO','dark')}${btn('REDO','dark')}${btn('RANDOM','purple')}${btn('X','red','studio-confirm')}</span></div><div class="editor-grid"><div class="preview"><div class="small-display">FIGHTER 1</div>${fighter()}<div class="row">${['STAND','RUN','JUMP','ATTACK','CHEER'].map(x=>btn(x,'dark')).join('')}</div><div class="row">${btn('TURN','dark')}${btn('FACE','dark')}</div></div><div class="editor-options"><div class="tabs">${Object.keys(studioGroups).map(x=>`<button type="button" class="ui-btn ${x===state.group?'gold':'dark'}" data-group="${x}">${x}</button>`).join('')}</div><div class="tabs">${categories.map(x=>`<button type="button" class="ui-btn ${x===category?'blue':'dark'}" data-category="${x}">${x.toUpperCase()}</button>`).join('')}${btn('LOCK','dark')}${btn('RANDOM PART','dark')}</div><div class="tile-grid">${options.map((x,i)=>`<button class="tile ${i===0?'sel':''}" type="button"><span class="face">${['◆','◈','✦','★','●'][i]}</span>${x}</button>`).join('')}</div><div class="swatches"><strong>COLOUR</strong>${['#f3d0b8','#e0b494','#c18b66','#9a6042','#6e3c29','#ebbc97','#d6bb62','#95c995','#88b9dd','#caa6d8'].map(x=>`<i style="background:${x}"></i>`).join('')}</div></div></div><div class="editor-footer"><div><strong style="color:var(--gold)">Saving is off right now: characters last until you leave.</strong><div class="small-note">Arrows: option / part · Q E: tab · R: random · Ctrl+Z / Y: undo / redo</div></div><div class="row">${btn('SAVE AS NEW','blue')}${btn('WEARING','green')}</div></div></div>${confirm?`<div class="overlay"><div class="card dialog" style="max-width:390px"><div class="band" style="background:var(--red)">UNSAVED CHANGES</div><div class="dialog-body"><p>Close without saving this character?</p><div class="row">${btn('KEEP EDITING','blue','studio')}${btn('DISCARD','red','bazaar')}</div></div></div></div>`:''}`
}
function arcade(){return `${bazaar()}<div class="overlay light"><div class="card dialog" style="max-width:480px"><div class="band">CABINET 01 · 1V1</div><div class="dialog-body"><p>One seat open. Fight a player, train against a CPU, or watch the current match.</p><div class="row" style="justify-content:space-between"><span class="pill">SEAT A · YOU</span><span class="pill">SEAT B · OPEN</span></div><div class="row" style="margin-top:18px">${btn('SIT','blue')}${btn('VS CPU','purple')}${btn('WATCH','gold','watching')}</div><p class="small-note">While watching: a persistent STOP WATCHING control appears over the fight.</p><div class="row">${btn('BACK TO BAZAAR','dark','bazaar')}</div></div></div></div>`}
function lounge(){return `${sky()}<div class="island market-ground"></div><div class="screen-title display">${state.format.toUpperCase()} · FIGHTER LOUNGE</div><div class="screen-sub">ROOM 1 · MAP VOTE · STOCK 3 · TEAMS FORMING</div><div class="pill lounge-status">PICK → MAP VOTE → RULES VOTE → FIGHT <strong style="color:var(--gold)">· MAP VOTE IN 18s</strong></div><div class="lounge-stations">${['STAIRS\nBAZAAR','MAP\nBOARD','WEAPON\nRACK','RULES','PLAYER\nRAIL'].map(x=>`<div class="station">${x.replace('\n','<br>')}</div>`).join('')}</div><div style="position:absolute;bottom:36%;left:45%">${fighter()}</div><div class="bottom-ui"><div class="hint-row"><span class="key">E</span> USE STATION</div>${btn('ROOM ▲','blue','pick')}</div>`}
const weps=['Sword','Scythe','Blasters','Grimoire','Battle Axe','Warpike','Gauntlets','War Hammer','Longbow','Chain Flail','Shield','Dual Daggers'];
function selectBase(extra=''){return `<div class="vote-sky"></div><div class="select-head"><div class="display" style="font-size:28px">${state.format.toUpperCase()} · ROOM 1</div><div class="pill">STOCK · 3 &nbsp; · &nbsp; ITEMS ON &nbsp; · &nbsp; DISASTERS OFF &nbsp; · &nbsp; MAP: VOTE</div></div><div class="select-status">${extra||'Pick your weapon and ready up. Every pedestal must be ready.'}</div>`}
function playerCard(enemy=false,vote=false){return `<div class="player-card card ${enemy?'orange':'green'}"><div class="band">${enemy?'■ CPU · NORMAL':'● ETondes · YOU'} <span style="float:right;font-size:13px">${vote?'VOTING':enemy?'READY':'SELECTING'}</span></div><div class="inside">${vote?`<div style="color:var(--gold);font-weight:900">ADD NORMAL BOT?</div><div class="mini">1 YES · 0 NO · 12s</div><div class="row">${btn('YES','green')}${btn('NO','red')}</div>`:enemy?`<div class="weapon">OPEN SLOT</div><div class="row" style="justify-content:center">${btn('+ ADD BOT','blue','bot-vote')}</div><div class="mini" style="text-align:center">EASY · NORMAL · HARD</div>`:`<div class="weapon">SWORD</div><div class="small-note" style="text-align:center">ALL-ROUNDER · ★☆☆</div><div class="stats">${['DMG','DEF','DEX','SPD'].map((x,i)=>`<div style="font-size:10px">${x}<div class="bar"><span style="width:${[60,55,75,60][i]}%"></span></div></div>`).join('')}</div>`}</div></div>`}
function pick(vote=false){if(state.format!=='1v1'){
 const n=Number(state.format[0]);const side=(team)=>Array.from({length:n},(_,i)=>`<div class="team-mini ${team===1?'green':'orange'}"><b>${team===1?'●':'■'} ${i===0&&team===1?'ETondes · YOU':i===0&&team===2?'CPU · NORMAL':'OPEN SLOT'}</b><span>${i===0&&team===1?'SWORD · SELECTING':i===0&&team===2?'SWORD · READY':'JOIN OR PROPOSE BOT'}</span></div>`).join('');
 return `${selectBase('Pick your weapon. Every player must ready before voting.')}<div class="weapon-roster">${weps.map((w,i)=>`<div class="weapon-portrait ${i===0?'active':''}">${['⚔','☾','▣','✦','🪓','➶','✊','🔨','⌁','◌','▣','⚔'][i]}<small>${w}</small></div>`).join('')}</div><div class="multi-teams"><div><h3>TEAM 1</h3>${side(1)}</div><strong class="display">VS</strong><div><h3>TEAM 2</h3>${side(2)}</div></div><div class="pick-footer"><span class="row">${btn('LEAVE','red','bazaar')}${btn('HIDE','dark','lounge')}</span>${btn('READY','green','map-vote')}</div>`}
 return `${selectBase(vote?'Vote to add a Normal CPU to the open pedestal.':'Pick your weapon and ready up.')}<div class="weapon-roster">${weps.map((w,i)=>`<div class="weapon-portrait ${i===0?'active':''}">${['⚔','☾','▣','✦','🪓','➶','✊','🔨','⌁','◌','▣','⚔'][i]}<small>${w}</small></div>`).join('')}</div><div class="pedestals"><div class="pedestal">${fighter()}<div class="plinth"></div>${playerCard()}</div><strong class="display" style="font-size:38px;color:var(--gold);padding-bottom:70px">VS</strong><div class="pedestal">${vote?'':`<div style="height:112px;font:900 90px Impact,sans-serif;color:#cbd9ee">?</div>`}<div class="plinth"></div>${playerCard(true,vote)}</div></div><div class="pick-footer"><span class="row">${btn('LEAVE','red','bazaar')}${btn('HIDE','dark','lounge')}</span>${btn('READY','green','map-vote')}</div>`}
const maps=['Hall of Champions','Bifrost Bridge','Dwarven Forge','Sky Temple','Sunscorch Ruins','Viking Harbor','Crystal Mines','Thunder Canyon','Muspel Peak','Random'];
function mapVote(){return `${selectBase('Pick the arena. Most votes wins; a tie is drawn at random.')}<div class="vote-title display">VOTE FOR THE ARENA</div><div class="clock">12</div><div class="map-grid">${maps.map((x,i)=>`<button type="button" class="map-card ${i===3?'chosen':''}">${i===9?'<span style="font:900 70px Impact,sans-serif">?</span>':'<i class="terrain"></i>'}${i===3?'<em>1 VOTE</em>':''}<b>${x.toUpperCase()}</b></button>`).join('')}</div><div class="voters"><span>✓ ETondes</span><span>CPU</span></div><div class="pick-footer">${btn('LEAVE','red','bazaar')}${btn('HIDE','dark','lounge')}${btn('NEXT: RULES','gold','rules-vote')}</div>`}
function rulesVote(){const rules=[['Tournament 1v1','★',['3 lives','No items / disasters','Ranked maps']],['Casual','◌',['3 lives','Items on','Map disaster']],['Chaos','✹',['3 minute clock','Every disaster','Random map']],['Keep Current','◇',['Current stock 3','Items on','Disasters off']]];return `${selectBase('Choose a rule set. Most votes wins.')}<div class="vote-title display">VOTE THE RULES</div><div class="clock">18</div><div class="rule-grid">${rules.map((r,i)=>`<button type="button" class="rule-card ${i===1?'chosen':''}"><div class="rh">${r[0]}</div><div class="emblem">${r[1]}</div><ul>${r[2].map(x=>`<li>${x}</li>`).join('')}</ul><div class="vote-count">${i===1?'1 VOTE':'VOTE'}</div></button>`).join('')}</div><div class="voters"><span>✓ ETondes</span><span>CPU</span></div><div class="pick-footer">${btn('LEAVE','red','bazaar')}${btn('HIDE','dark','lounge')}${btn('NEXT: FIGHT','gold','fight-count')}</div>`}
function boards(){const b=state.board;let content='';if(b==='Maps')content=`<div class="row">${['Host picks','Everyone votes','Random'].map(x=>btn(x,x==='Everyone votes'?'gold':'dark')).join('')}</div><div class="row" style="margin:10px 0">${btn('ALL MAPS','gold')}${btn('RANKED','dark')}</div><div class="mini-map">${maps.slice(0,6).map(x=>`<button class="option" type="button">▰<span class="sub">${x}</span></button>`).join('')}</div>`;if(b==='Weapons')content=`<div class="mini-map">${weps.map((x,i)=>`<button class="option ${i===0?'selected':''}" type="button">${['⚔','☾','▣','✦','🪓','➶','✊','🔨','⌁','◌','▣','⚔'][i]} <span class="sub">${x}</span></button>`).join('')}</div>`;if(b==='Rules')content=`<div class="scroll-list"><div class="option">PRESET · CASUAL <span class="sub">3 lives, items on, map disaster</span></div><div class="row">${btn('STOCK','gold')}${btn('TIMED','dark')}${btn('1 LIFE','dark')}${btn('3 LIVES','gold')}${btn('5 LIVES','dark')}</div><div class="row">${btn('ITEMS ON','gold')}${btn('DISASTERS · MAP','blue')}</div><div class="option">BOTS <span class="sub">Off until explicitly added. Team 2 · Place 2 · CPU Normal</span></div></div>`;if(b==='Players')content=`<div class="record-grid"><div class="option">TEAM 1 · ETondes <span class="sub">Sword · SELECTING</span></div><div class="option">TEAM 2 · CPU Normal <span class="sub">Sword · READY</span></div></div><div class="row" style="margin-top:14px">${btn('READY','green')}${btn('WAITING FOR TEAM','dark')}</div>`;return `${lounge()}<div class="overlay"><div class="card dialog"><div class="band">1V1 · ROOM 1 · ${b.toUpperCase()}</div><div class="dialog-body"><div class="tabs">${['Maps','Weapons','Rules','Players'].map(x=>`<button type="button" class="ui-btn ${b===x?'gold':'dark'}" data-board="${x}">${x}</button>`).join('')}</div><p class="small-note">${b==='Weapons'?'Your weapon · server confirmed':b==='Players'?'Every player readies before start':'Host edits shared settings · players can vote where enabled'}</p>${content}<div class="row" style="margin-top:12px">${btn('BACK TO ROOM','dark','lounge')}</div></div></div></div>`}
function notice(){return `${lounge()}<div class="overlay light"><div class="card dialog" style="max-width:460px"><div class="band" style="background:${state.notice==='error'?'var(--red)':'var(--blue)'}">${state.notice==='error'?'HOLD ON':'GET READY'}</div><div class="dialog-body"><p>${state.notice==='error'?'The match could not start. Return to the room and check the roster.':'Loading arena and fighters…'}</p><div class="row">${state.notice==='error'?btn('OK','dark','lounge'):btn('SHOW ERROR','dark')}</div><p class="small-note">${state.notice==='error'?'Acknowledge the problem to return to the room.':'SHOW ERROR previews the failure state of this concept.'}</p></div></div></div>`}
function climb(records=false){return `${sky()}<div class="climb-tower"></div><div style="position:absolute;left:37%;bottom:23%">${fighter()}</div><div class="climb-hud"><span class="display">SKYLINE CLIMB</span><span class="pill">CHECKPOINT 3 / 8 · THE BRIDGE</span><span class="pill" style="font:900 22px Impact,sans-serif">1:42.53</span><span class="pill">2 FALLS · BEST: ROOFTOP ACCESS</span></div><div class="climb-actions">${btn('RECORDS','blue','records')}${btn('RESTART','dark')}${btn('SKIP · 49 R$','purple')}${btn('◂ BAZAAR','red','bazaar')}</div>${records?`<div class="overlay"><div class="card dialog"><div class="band" style="background:var(--gold);color:var(--ink);text-shadow:none">SKYLINE CLIMB · RECORDS</div><div class="dialog-body"><div class="record-grid"><div><strong>SPEED</strong><ol><li>Ash · 1:04.18</li><li>Rowan · 1:11.29</li><li>Jules · 1:24.06</li></ol></div><div><strong>REACH</strong><ol><li>Rowan · Summit ×3</li><li>Ash · Summit ×1</li><li>ETondes · Checkpoint 3</li></ol></div></div><p class="small-note">You: Checkpoint 3 · 1:42.53</p>${btn('CLOSE','dark','climb')}</div></div></div>`:''}`}
function hudTiles(spectator=false){
 const n=2*Number(state.format[0]);
 return `<div class="hud-tiles ${n>2?'multi':''}">${Array.from({length:n},(_,i)=>`<div class="hud-tile ${i%2?'enemy':''} ${i===0&&!spectator?'you':''}"><div class="band">${i%2?'■':'●'} ${i===0?'ETondes':i===1?'CPU':`P${i+1}`} <span style="float:right">${n>2?'●●':'● ● ●'}</span></div><div class="num">${[89,124,32,67,18,102][i]}%</div><div class="meter"><b style="width:${[70,90,20,45,15,60][i]}%"></b></div></div>`).join('')}</div>`
}
function fight(kind,spectator=false){const count=kind==='count',alert=kind==='alert',ult=kind==='ult';return `${sky(false,true)}<div class="fight-ground"></div><div class="fighters-fight ${state.format==='1v1'?'':'multi'}">${Array.from({length:2*Number(state.format[0])},(_,i)=>fighter(i%2===1)).join('')}</div><div class="fight-top"><div class="pill">${alert?'SUDDEN DEATH':count?'3:00':'2:54'}</div>${spectator?'<div class="pill">WATCHING · CABINET 01</div>':'<div class="fight-keys"><span class="key">O</span> ULTIMATE <span class="key">I</span> SHIELD <span class="key">P</span> PICKUP <span class="key">H</span> COMBOS</div>'}</div><div class="alert">${alert?'⚠ METEOR SHOWER · 5s':ult?'ULTIMATE READY — PRESS O':count?'MUSPEL PEAK':''}</div>${count?'<div class="fight-callout display">3</div>':''}${alert?'<div class="combo">5 HITS · 38% &nbsp; PERFECT ×2</div>':''}${ult?'<div class="fight-callout display" style="font-size:clamp(30px,5cqw,64px);transform:rotate(-7deg)">SWORD · FINAL CLEAVE<br><small>ETondes</small></div>':''}${hudTiles(spectator)}${state.format==='1v1'?'<div style="position:absolute;top:43%;left:43%;color:white;font-weight:900;text-shadow:2px 2px var(--ink)">● 89%</div><div style="position:absolute;top:41%;left:58%;color:white;font-weight:900;text-shadow:2px 2px var(--ink)">■ 124%</div>':''}${spectator?'':`<div style="position:absolute;bottom:2%;right:2%;z-index:8">${btn('RESULTS','dark','results')}</div>`}`}
function watching(){return `${fight('live',true)}<div style="position:absolute;right:2%;bottom:2%;z-index:9">${btn('STOP WATCHING','red','bazaar')}</div>`}
function results(){
 const n=2*Number(state.format[0]);
 const slots=Array.from({length:n},(_,i)=>`<div class="podium-slot" style="width:${n===2?'30%':`${Math.floor(90/n)}%`}">${fighter(i%2===1)}<div class="card result-card"><b>${['1ST','2ND','3RD','4TH','5TH','6TH'][i]}</b><br>${i===0?'● ETondes':`${i%2?'■':'●'} Fighter ${i+1}`}<br>${Math.max(0,4-i)} KO · ${89+18*i}%<br>${i+1} FALL${i?'S':''}</div><div class="pillar"></div></div>`).join('');
 return `<div class="results-sky"></div><div class="display" style="position:absolute;top:6%;left:0;right:0;text-align:center;color:var(--gold);font-size:clamp(38px,5cqw,72px)">${n===2?'VICTORY!':'TEAM 1 WINS!'}</div><div style="position:absolute;top:2%;left:44%;z-index:5">${btn('SAY GG!','green')}</div><div class="podium-row ${n>2?'multi':''}">${slots}</div><div class="pill" style="position:absolute;bottom:2%;right:2%;z-index:5">Returning to room when server is ready</div>`
}
function render(){let v=state.view;let html=v==='bazaar'?bazaar():v.startsWith('social-')?social(v.slice(7)):v==='studio'?studio():v==='studio-confirm'?studio(true):v==='arcade'?arcade():v==='watching'?watching():v==='lounge'?lounge():v==='pick'?pick():v==='bot-vote'?pick(true):v==='map-vote'?mapVote():v==='rules-vote'?rulesVote():v==='boards'?boards():v==='notice'?notice():v==='climb'?climb():v==='records'?climb(true):v==='fight-count'?fight('count'):v==='fight-live'?fight('live'):v==='fight-alert'?fight('alert'):v==='fight-ult'?fight('ult'):results();$('screen').innerHTML=html;$('screen').className='screen'+(state.mobile?' mobile':'');const meta=views.find(x=>x[0]===v);$('note-title').textContent=meta[1];$('note-text').textContent=meta[2];$('note-points').innerHTML=meta[3].map(x=>`<li>${x}</li>`).join('');$('counter').textContent=`${views.findIndex(x=>x[0]===v)+1} / ${views.length} views`;$('view').value=v}
$('view').innerHTML=views.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');$('view').addEventListener('change',e=>{state.view=e.target.value;render()});$('format').addEventListener('change',e=>{state.format=e.target.value;render()});$('desktop').addEventListener('click',()=>{state.mobile=false;$('desktop').setAttribute('aria-pressed','true');$('mobile').setAttribute('aria-pressed','false');render()});$('mobile').addEventListener('click',()=>{state.mobile=true;$('mobile').setAttribute('aria-pressed','true');$('desktop').setAttribute('aria-pressed','false');render()});$('screen').addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){state.view=go.dataset.go;render();return}const board=e.target.closest('[data-board]');if(board){state.board=board.dataset.board;render();return}const group=e.target.closest('[data-group]');if(group){state.group=group.dataset.group;state.category=studioGroups[state.group][0];render();return}const category=e.target.closest('[data-category]');if(category){state.category=category.dataset.category;render();return}if(e.target.textContent==='SHOW ERROR'){state.notice='error';render()}});render();
</script></body></html>
